name: Extract Heavenly Website

on:
  workflow_dispatch:
  push:
    paths:
      - "unzip -o heavenly-github-ready-fixed.zip -d /tmp/heavenly"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          mkdir -p /tmp/heavenly
          unzip -o heavenly-github-ready.zip -d /tmp/heavenly
          cp -a /tmp/heavenly/. .
          rm -f heavenly-github-ready-fixed.zip

      - name: Save website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add Heavenly website project files"
          git push
